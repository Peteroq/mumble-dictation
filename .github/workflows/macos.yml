name: macOS

# Runs the shared dictionary contract against the Swift implementation. The Windows
# workflow runs the identical vectors against the C# one. Both must be green for the two
# implementations to be considered in agreement — that pairing is the whole point.

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary-contract:
    name: Dictionary contract
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2, but the runner defaults to an
      # older Xcode (Swift 6.1) and fails to even parse the manifest. Select the newest
      # Xcode present rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # Both test targets are deliberately platform-neutral — the dictionary for the
      # cross-platform contract, the cleanup guard so the check that stops a model
      # answering your dictation is covered somewhere that isn't a laptop.
      #
      # Neither may depend on the app target, and that is a load-bearing rule rather than
      # tidiness. SwiftPM links every test target into one bundle, so a single test that
      # reaches the app pulls FoundationModels into it, and the whole bundle then fails to
      # dlopen on a runner older than the app's deployment target — taking the contract
      # tests down with it, before a single assertion runs.
      - name: Test
        run: swift test

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/MumbleDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/MumbleDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."
